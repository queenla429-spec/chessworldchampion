<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e3730"><meta name="mobile-web-app-capable" content="yes">
<title>체스 아레나</title>
<style>
:root{--bg:#f4f1e8;--card:#fffdf7;--ink:#26302a;--mut:#69715f;--ln:#cfd3c2;--lt:#ecd9b0;--dk:#a8794a;--hi:#e9d95a;--mv:#3a7d44;--acc:#2e3730;--ai:#fbf8ec}
@media(prefers-color-scheme:dark){:root{--bg:#1b201c;--card:#252b26;--ink:#e8e9df;--mut:#9aa292;--ln:#3b443c;--lt:#cdb88a;--dk:#7d5a38;--hi:#a99a2e;--mv:#6fbf7b;--acc:#d9dccb;--ai:#1b201c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--acc);color:var(--ai)}
main{max-width:980px;margin:0 auto;padding:14px}.g{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:800px){.g{grid-template-columns:minmax(0,500px) 1fr}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:3px;padding:14px;margin-bottom:14px}
h3{margin:0 0 8px;font-size:1em}.big{font-size:1.6em;font-weight:800}
button,select,input,textarea{font:inherit;padding:6px 12px;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:3px}
textarea{width:100%}button{cursor:pointer;font-weight:700}button.p{background:var(--acc);color:var(--ai);border-color:var(--acc)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}.mut{color:var(--mut);font-size:.9em}.err{color:#c0392b;min-height:1.2em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.tabs button.on{background:var(--acc);color:var(--ai)}
#bd{width:min(100%,480px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:2px solid var(--acc);margin:6px auto;user-select:none}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(8.2vw,46px);line-height:1;position:relative;cursor:pointer}
.lt{background:var(--lt)}.dk{background:var(--dk)}.lm,.sel{background:var(--hi)!important}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}.b{color:#111;text-shadow:0 0 1px #aaa}
.dot::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--mv);opacity:.7;position:absolute}
.cap::after{width:88%;height:88%;background:none;border:3px solid var(--mv)}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--ln)}
.pl{display:flex;justify-content:space-between;width:min(100%,480px);margin:auto;font-weight:700}.st{text-align:center;margin:8px 0;font-weight:700}.mv{max-height:80px;overflow:auto}.me td{font-weight:800}
</style></head><body>
<header><b>♞ 체스 아레나</b><span id="hd"></span></header>
<main id="app">불러오는 중…</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const KEY='chessDemo2',SK='chessUid',EM='@chess.example.com',GL={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const TI=[['브론즈',0],['실버',1000],['골드',1100],['플래티넘',1200],['다이아',1300],['마스터',1400],['챌린저',1500]];
const DS={win:25,loss:-15,draw:5,place:5,min:10,start:900};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tier=s=>{let t=0;TI.forEach((x,i)=>{if(s>=x[1])t=i});return t};
const $=id=>document.getElementById(id),v=id=>($(id)||{}).value||'';
let cfg=null;try{cfg=JSON.parse(localStorage.getItem('chessCfg'))}catch(e){}
let demo=false;try{demo=localStorage.getItem('chessDemoOn')==='1'}catch(e){}
const hm=location.hash.match(/fb=([^&]+)/);
if(hm){try{cfg=JSON.parse(decodeURIComponent(escape(atob(hm[1].replace(/-/g,'+').replace(/_/g,'/')))));localStorage.setItem('chessCfg',JSON.stringify(cfg));localStorage.removeItem('chessDemoOn');demo=false;history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
const pre=new URLSearchParams(location.search).get('c')||(()=>{try{return localStorage.getItem('chessCls')||''}catch(e){return''}})();
const live=!!cfg;

// ---------- Backend (Firebase or localStorage demo) ----------
const B=(()=>{
  let fa,fw,fd,off=0,al=[],dl={};
  const P=p=>p.split('/').filter(Boolean),cp=o=>o==null?null:JSON.parse(JSON.stringify(o));
  const gp=(o,p)=>{let c=o;for(const k of P(p)){if(c==null||typeof c!=='object')return null;c=c[k]}return c===undefined?null:cp(c)};
  const sp=(o,p,x)=>{const a=P(p);let c=o;a.slice(0,-1).forEach(k=>{if(!c[k]||typeof c[k]!=='object')c[k]={};c=c[k]});const l=a[a.length-1];if(x==null)delete c[l];else c[l]=cp(x)};
  const seed=()=>{const u=(l,n)=>({loginId:l,name:n,score:900,placed:0,wins:0,losses:0,draws:0});return{config:{master:'m'},classList:{'3-2':{name:'3학년 2반 (데모)'}},
    members:{s1:{cid:'3-2',role:'student'},s2:{cid:'3-2',role:'student'},s3:{cid:'3-2',role:'student'}},
    auth:{master:{uid:'m',pw:'123456'},'3-2.kim01':{uid:'s1',pw:'123456'},'3-2.lee02':{uid:'s2',pw:'123456'},'3-2.park03':{uid:'s3',pw:'123456'}},
    classes:{'3-2':{meta:{name:'3학년 2반 (데모)'},users:{s1:u('kim01','김민준'),s2:u('lee02','이서연'),s3:u('park03','박지호')}}}}};
  const L=()=>{try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return x}catch(e){}const s=seed();sv(s,1);return s};
  const sv=(s,q)=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}if(!q)fire()};
  const fire=()=>{const s=L();for(const p in dl)dl[p].forEach(cb=>cb(gp(s,p)))};
  addEventListener('storage',e=>{if(e.key===KEY)fire()});
  const uid=()=>{try{return sessionStorage.getItem(SK)}catch(e){return null}},setU=u=>{try{u?sessionStorage.setItem(SK,u):sessionStorage.removeItem(SK)}catch(e){}al.forEach(f=>f(u))};
  const sc=s=>new Promise((a,b)=>{const e=document.createElement('script');e.src=s;e.onload=a;e.onerror=()=>b(new Error('Firebase SDK 로드 실패'));document.head.appendChild(e)});
  const em=k=>k.toLowerCase()+EM;
  return{
    now:()=>Date.now()+off,onAuth:f=>al.push(f),
    async init(){
      if(!live){setTimeout(()=>al.forEach(f=>f(uid())),30);return}
      for(const f of['app','auth','database'])await sc('https://www.gstatic.com/firebasejs/10.12.2/firebase-'+f+'-compat.js');
      fa=firebase.initializeApp(cfg);fw=firebase.initializeApp(cfg,'w').auth();fd=firebase.database();
      fd.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
      fa.auth().onAuthStateChanged(u=>al.forEach(f=>f(u?u.uid:null)));
    },
    async signIn(k,pw){if(!live){const a=L().auth[k.toLowerCase()];if(!a||a.pw!==pw)throw{code:'auth/invalid-credential'};setU(a.uid);return}await fa.auth().signInWithEmailAndPassword(em(k),pw)},
    async create(k,pw,self){k=k.toLowerCase();
      if(!live){const s=L();if(s.auth[k])throw{code:'auth/email-already-in-use'};const u='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);s.auth[k]={uid:u,pw};sv(s);if(self)setU(u);return u}
      if(self)return(await fa.auth().createUserWithEmailAndPassword(em(k),pw)).user.uid;
      const c=await fw.createUserWithEmailAndPassword(em(k),pw);await fw.signOut();return c.user.uid},
    async signOut(){if(!live)setU(null);else await fa.auth().signOut()},
    async setPw(pw){if(!live){const s=L(),u=uid();for(const k in s.auth)if(s.auth[k].uid===u)s.auth[k].pw=pw;sv(s);return}await fa.auth().currentUser.updatePassword(pw)},
    async get(p){return live?(await fd.ref(p).once('value')).val():gp(L(),p)},
    async set(p,x){if(!live){const s=L();sp(s,p,x);sv(s);return}await fd.ref(p).set(x)},
    async upd(p,u){if(!live){const s=L();for(const k in u)sp(s,(p?p+'/':'')+k,u[k]);sv(s);return}await fd.ref(p||undefined).update(u)},
    rm(p){return this.set(p,null)},
    on(p,cb){if(!live){(dl[p]=dl[p]||new Set()).add(cb);setTimeout(()=>cb(gp(L(),p)),0);return()=>dl[p].delete(cb)}const r=fd.ref(p),f=s=>cb(s.val());r.on('value',f);return()=>r.off('value',f)},
    async tx(p,fn){if(!live){const s=L(),c=gp(s,p),n=fn(c);if(n===undefined)return{committed:false,val:c};sp(s,p,n);sv(s);return{committed:true,val:n}}
      const r=await fd.ref(p).transaction(c=>fn(c));return{committed:r.committed,val:r.snapshot.val()}},
    reset(){try{localStorage.removeItem(KEY);sessionStorage.removeItem(SK)}catch(e){}}
  };
})();

// ---------- State ----------
let me=null,role=null,cid=null,C={},CL={},MASTER=null,gid=null,sel=null,tab='cls',err='',msg='',share=null,searching=false,ready=false,off1=null,off2=null;
const pth=()=>'classes/'+cid+'/',St=()=>Object.assign({},DS,C.settings),U=()=>C.users||{},GS=()=>C.games||{},nm=u=>U()[u]?U()[u].name:'?';
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return(s/60|0)+':'+String(s%60).padStart(2,'0')};

async function ident(){
  const uid=me;off1&&off1();off2&&off2();role=null;C={};
  if(!uid){ready=true;render();return}
  MASTER=await B.get('config/master');
  if(MASTER===uid){role='master';off2=B.on('classList',x=>{CL=x||{};if(!cid||!CL[cid])cid=CL[pre]?pre:Object.keys(CL)[0]||null;watch();render()})}
  else{const m=await B.get('members/'+uid);if(m){role='student';cid=m.cid;watch()}}
  ready=true;render();
}
function watch(){off1&&off1();off1=null;if(cid)off1=B.on('classes/'+cid,x=>{C=x||{};chk();render()})}
function chk(){
  if(searching){const g=Object.entries(GS()).find(([,x])=>x.status==='play'&&(x.w===me||x.b===me)&&x.ts>=searching);if(g){gid=g[0];searching=false}}
}

// ---------- Game logic ----------
function newG(a,b,rank,by){
  const[w,bk]=Math.random()<.5?[a,b]:[b,a],id=String(B.now()),n=B.now(),m=St().min*60000;
  B.set(pth()+'games/'+id,{w,b:bk,wn:nm(w),bn:nm(bk),rank,by,fen:new Chess().fen(),status:'play',ts:n,clock:{w:m,b:m,t:n}});return id;
}
function endOf(g,c,m){g.status='done';if(c.in_checkmate()){g.result=m.color==='w'?'1-0':'0-1';g.why='체크메이트'}else{g.result='1/2-1/2';g.why=c.in_stalemate()?'스테일메이트':'무승부'}}
function move(from,to){
  const id=gid,exp=GS()[id].fen,n=B.now();sel=null;
  B.tx(pth()+'games/'+id,g=>{
    if(!g||g.status!=='play'||g.fen!==exp)return;const c=new Chess(g.fen),t=c.turn(),m=c.move({from,to,promotion:'q'});if(!m)return;
    g.clock[t]-=n-g.clock.t;g.clock.t=n;
    if(g.clock[t]<=0){g.status='done';g.result=t==='w'?'0-1':'1-0';g.why='시간 초과';return g}
    g.fen=c.fen();g.moves=(g.moves||[]).concat(m.san);g.last=[from,to];if(c.game_over())endOf(g,c,m);return g
  }).then(r=>fin(id,r));
}
function closeG(id,fn){B.tx(pth()+'games/'+id,g=>{if(!g||g.status!=='play')return;return fn(g)||undefined}).then(r=>fin(id,r))}
const resign=id=>closeG(id,g=>{g.status='done';g.result=g.w===me?'0-1':'1-0';g.why='기권';return g});
function claim(id){const n=B.now();closeG(id,g=>{const t=new Chess(g.fen).turn();if(g.clock[t]-(n-g.clock.t)>0)return;g.status='done';g.result=t==='w'?'0-1':'1-0';g.why='시간 초과';return g})}
function fin(id,r){const g=r.val;if(r.committed&&g&&g.status==='done')settle(id,g)}
function settle(id,g){
  B.tx(pth()+'games/'+id+'/scored',x=>x?undefined:1).then(r=>{
    if(!r.committed||!g.rank)return;const S=St(),a=g.result==='1-0'?S.win:g.result==='0-1'?S.loss:S.draw,b=g.result==='1-0'?S.loss:g.result==='0-1'?S.win:S.draw;
    g.d={w:a,b};B.set(pth()+'games/'+id+'/d',g.d);apply(g,1)});
}
function apply(g,sg){
  const up={};['w','b'].forEach(c=>{const u=U()[g[c]];if(!u)return;const r=g.result,k=r==='1/2-1/2'?'draws':((r==='1-0')===(c==='w')?'wins':'losses'),p=pth()+'users/'+g[c]+'/';
    up[p+'score']=Math.max(0,u.score+sg*g.d[c]);up[p+'placed']=Math.max(0,(u.placed||0)+sg);up[p+k]=Math.max(0,(u[k]||0)+sg)});
  B.upd('',up);
}
async function search(){
  searching=B.now();render();let mt=null;
  const r=await B.tx(pth()+'queue',q=>{q=q||{};const o=Object.keys(q).find(k=>k!==me);if(o){mt=o;delete q[o];return Object.keys(q).length?q:null}mt=null;q[me]=B.now();return q});
  if(mt){newG(me,mt,true,'random')}
}
async function addS(id,name,pw){
  id=id.trim().toLowerCase();name=name.trim();
  if(!/^[a-z0-9._-]{2,20}$/.test(id)||!name)throw new Error('아이디(영문·숫자 2~20자)와 이름을 확인하세요.');
  let u;try{u=await B.create(cid+'.'+id,pw)}catch(e){throw new Error(e.code==='auth/email-already-in-use'?id+': 이미 있는 아이디예요. (삭제한 학생이면 Firebase 콘솔에서 계정도 삭제하세요)':e.message)}
  await B.set('members/'+u,{cid,role:'student'});await B.set(pth()+'users/'+u,{loginId:id,name,score:St().start,placed:0,wins:0,losses:0,draws:0});
}

// ---------- Views ----------
function boardHtml(g){
  const c=new Chess(g.fen),bd=c.board(),tm={};if(sel&&g.status==='play')c.moves({square:sel,verbose:true}).forEach(m=>tm[m.to]=1);
  let h=[];for(let r=0;r<8;r++)for(let f=0;f<8;f++){const sq='abcdefgh'[f]+(8-r),p=bd[r][f];
    h.push(`<div class="sq ${(r+f)%2?'dk':'lt'}${g.last&&g.last.includes(sq)?' lm':''}${sq===sel?' sel':''}${tm[sq]?(p?' dot cap':' dot'):''}" data-sq="${sq}">${p?`<span class="${p.color}">${GL[p.type.toUpperCase()]}\uFE0E</span>`:''}</div>`)}
  if(g.b===me)h.reverse();return h.join('');
}
function clk(g,c){return fmt(g.clock[c]-(g.status==='play'&&new Chess(g.fen).turn()===c?B.now()-g.clock.t:0))}
function gameView(){
  const g=GS()[gid];if(!g){gid=null;return render()}
  const c=new Chess(g.fen),top=g.b===me?'w':'b',bot=top==='w'?'b':'w',N=x=>esc(x==='w'?g.wn:g.bn);
  const pl=g.w===me||g.b===me,my=g.w===me?'w':'b';
  let st;if(g.status==='play')st=(c.turn()==='w'?'백':'흑')+' 차례'+(c.in_check()?' · 체크!':'')+(pl&&c.turn()===my?' — 내 차례':'');
  else if(g.status==='void')st='무효 처리된 경기';
  else{const win=(g.result==='1-0'&&my==='w')||(g.result==='0-1'&&my==='b');st=(pl?(g.result==='1/2-1/2'?'무승부':win?'승리!':'패배'):'종료 '+g.result)+' ('+g.why+')'+(g.d&&pl?` · ${g.d[my]>0?'+':''}${g.d[my]}점`:'')}
  $('app').innerHTML=`<div class="card"><div class="row"><button data-a="close">← 나가기</button><span class="mut">${g.rank?'🏆 랭크전':'🎮 일반전'}</span></div>
    <div class="pl"><span>${N(top)}</span><span id="c${top}">${clk(g,top)}</span></div><div id="bd">${boardHtml(g)}</div>
    <div class="pl"><span>${N(bot)}</span><span id="c${bot}">${clk(g,bot)}</span></div><div class="st">${st}</div>
    <div class="row">${g.status==='play'&&pl?'<button data-a="res">기권</button>':''}</div><div class="mv mut">${(g.moves||[]).map((m,i)=>(i%2?'':(i/2+1|0)+'. ')+m).join(' ')}</div></div>`;
}
function lb(){
  const S=St(),l=Object.entries(U()).sort((a,b)=>b[1].score-a[1].score);
  return `<h3>📊 순위표</h3><table><tr><th>#</th><th>이름</th><th>티어</th><th>점수</th><th>승/무/패</th></tr>${l.map(([id,u],i)=>`<tr class="${id===me?'me':''}"><td>${i+1}</td><td>${esc(u.name)}</td><td>${(u.placed||0)<S.place?'배치 '+(u.placed||0)+'/'+S.place:TI[tier(u.score)][0]}</td><td>${u.score}</td><td>${u.wins||0}/${u.draws||0}/${u.losses||0}</td></tr>`).join('')}</table>`;
}
function gl(arr){return arr.length?arr.map(([id,g])=>`<div class="row"><button data-a="open" data-id="${id}">${esc(g.wn)} vs ${esc(g.bn)}</button><span class="mut">${g.rank?'🏆':'🎮'} ${g.status==='play'?'진행 중':g.status==='void'?'무효':g.result+' '+g.why}</span></div>`).join(''):'<span class="mut">아직 없어요</span>'}
function home(){
  const u=U()[me],S=St(),pl=(u.placed||0)<S.place,t=tier(u.score),nx=TI[t+1];
  const mine=Object.entries(GS()).filter(([,g])=>g.w===me||g.b===me).sort((a,b)=>b[0]-a[0]);
  $('app').className='g';
  $('app').innerHTML=`<div><div class="card"><div class="mut">현재 티어</div><div class="big">${pl?`배치고사 ${u.placed||0}/${S.place}`:TI[t][0]}</div><div>${u.score}점${!pl&&nx?` · ${nx[0]}까지 ${nx[1]-u.score}점`:''}</div><div class="mut">${u.wins||0}승 ${u.draws||0}무 ${u.losses||0}패</div></div>
    <div class="card"><h3>대국하기</h3>${searching?'<p>매칭 중… 상대를 기다리고 있어요.</p><button data-a="qc">취소</button>':`<button class="p" data-a="rank">🏆 랭크전 (랜덤 매치)</button>
    <div class="row"><select id="op">${Object.entries(U()).filter(([n])=>n!==me).map(([n,x])=>`<option value="${esc(n)}">${esc(x.name)}</option>`).join('')}</select><select id="rk"><option value="1">랭크전</option><option value="">일반전</option></select><button data-a="chal">1:1 도전</button></div>`}
    <p class="err">${esc(err)}</p><p class="mut">시간: 한 사람당 ${S.min}분</p></div></div>
    <div><div class="card"><h3>🕘 내 경기</h3>${gl(mine.slice(0,8))}</div><div class="card">${lb()}</div></div>`;
}
function shareHtml(){
  const base=location.origin+location.pathname,url=live?`${base}?c=${encodeURIComponent(share)}#fb=${btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}`:`${base}?c=${encodeURIComponent(share)}`;
  return `<div class="card"><h3>학생 접속 링크 (${esc(share)})</h3><img alt="QR" width="180" height="180" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}"><textarea rows="3" readonly>${esc(url)}</textarea><button data-a="shx">닫기</button></div>`;
}
function adminTab(){
  const S=St(),us=Object.entries(U()),gs=Object.entries(GS()).sort((a,b)=>b[0]-a[0]);
  if(tab==='cls')return `<div class="card"><h3>🏫 반 관리</h3>${Object.entries(CL).map(([id,c])=>`<div class="row"><b>${esc(c.name)}</b><span class="mut">${esc(id)}</span><button data-a="pick" data-id="${esc(id)}" class="${id===cid?'p':''}">관리하기</button><button data-a="shr" data-id="${esc(id)}">접속 링크</button><button data-a="dcls" data-id="${esc(id)}">삭제</button></div>`).join('')||'<span class="mut">반이 없어요</span>'}
    <h3 style="margin-top:12px">새 반 만들기</h3><div class="row"><input id="cn" placeholder="반 이름"><input id="cc" placeholder="반 코드(영문·숫자)" autocapitalize="none"><button data-a="ncls">만들기</button></div><p class="err">${esc(err)}</p></div>${share?shareHtml():''}`;
  if(!cid)return '<div class="card">먼저 반을 만들어 주세요.</div>';
  if(tab==='live')return `<div class="card"><h3>실시간 경기</h3>${gl(gs.filter(([,g])=>g.status==='play'))}</div>`;
  if(tab==='asg'){const o=us.map(([n,x])=>`<option value="${esc(n)}">${esc(x.name)}</option>`).join('');return `<div class="card"><h3>매치 배정</h3><div class="row"><select id="a1">${o}</select> vs <select id="a2">${o}</select><select id="ar"><option value="1">랭크전</option><option value="">일반전</option></select><button class="p" data-a="asg">배정</button></div><p class="err">${esc(err)}</p></div>`}
  if(tab==='stu')return `<div class="card"><h3>학생 관리 (${esc(CL[cid]?CL[cid].name:'')})</h3><div class="row"><input id="ai" placeholder="아이디" size="8" autocapitalize="none"><input id="an" placeholder="이름" size="8"><button data-a="add">추가</button></div>
    <textarea id="bk" rows="3" placeholder="일괄 등록: 줄마다 아이디,이름 (초기 비밀번호 123456)"></textarea><div class="row"><button data-a="bulk">일괄 등록</button></div><p class="err">${esc(err)}</p>
    <table><tr><th>아이디</th><th>이름</th><th>점수</th><th></th></tr>${us.map(([n,x])=>`<tr><td>${esc(x.loginId)}</td><td>${esc(x.name)}</td><td>${x.score}</td><td><button data-a="esc" data-id="${n}">점수</button> <button data-a="del" data-id="${n}">삭제</button></td></tr>`).join('')}</table></div>`;
  if(tab==='rank')return `<div class="card">${lb()}</div>`;
  if(tab==='log')return `<div class="card"><h3>경기 기록</h3>${gs.filter(([,g])=>g.status!=='play').map(([id,g])=>`<div class="row"><button data-a="open" data-id="${id}">${esc(g.wn)} vs ${esc(g.bn)}</button><span class="mut">${g.rank?'🏆':'🎮'} ${g.status==='void'?'무효':g.result+' '+g.why}</span>${g.status==='done'&&g.rank&&g.d?`<button data-a="void" data-id="${id}">무효 처리</button>`:''}</div>`).join('')||'<span class="mut">기록 없음</span>'}</div>`;
  return `<div class="card"><h3>경기·점수 규칙</h3><div class="row">${[['win','승리 점수'],['loss','패배 점수'],['draw','무승부 점수'],['place','배치고사 경기 수'],['min','한 사람당 시간(분)'],['start','시작 점수']].map(([k,l])=>`<label>${l}<br><input id="s_${k}" type="number" value="${S[k]}" style="width:90px"></label>`).join('')}</div>
    <div class="row"><button class="p" data-a="sset">저장</button><button data-a="sdef">기본값으로</button></div><p class="err">${esc(err)}${esc(msg)}</p>
    <h3 style="margin-top:12px">시즌</h3><p class="mut">${Object.values(C.seasons||{}).map(s=>`시즌 ${s.n}: ${esc(s.name)} (${s.score}점)`).join(' · ')||'기록 없음'}</p><button data-a="season">시즌 종료 & 챔피언 기록</button></div>`;
}
function masterView(){
  const T=[['cls','🏫 반 관리'],['live','실시간 경기'],['asg','매치 배정'],['stu','학생 관리'],['rank','순위표'],['log','경기 기록'],['set','설정']];
  $('app').className='';
  $('app').innerHTML=`<div class="tabs">${T.map(([k,l])=>`<button data-a="tab" data-id="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</div>${adminTab()}`;
}
function connectView(){
  $('app').innerHTML=`<div class="card" style="max-width:480px;margin:auto"><h3>체스 아레나 · 시작하기</h3><p class="mut">선생님이 본인의 Firebase를 연결합니다. (README의 설정 순서 참고) 학생은 선생님이 준 접속 링크나 QR로 들어오세요.</p>
    <textarea id="cf" rows="6" placeholder="const firebaseConfig = { ... };"></textarea><div class="row"><button class="p" data-a="conn">연결하기</button><button data-a="demo">설정 없이 데모로 체험</button></div><p class="err">${esc(err)}</p></div>`;
}
function loginView(){
  const first=live&&MASTER===null;
  $('app').innerHTML=`<div class="card" style="max-width:380px;margin:auto"><h3>${first?'선생님(master) 첫 설정':'로그인'}</h3>
    ${first?`<div class="row"><input id="mn" placeholder="표시 이름"></div><div class="row"><input id="lp" type="password" placeholder="비밀번호(6자 이상)"></div><button class="p" data-a="setup">관리자 계정 만들기</button>`:
    `<div class="row"><input id="lc" placeholder="반 코드 (선생님은 비우기)" value="${esc(pre)}" autocapitalize="none"></div><div class="row"><input id="li" placeholder="아이디" autocapitalize="none"></div><div class="row"><input id="lp" type="password" placeholder="비밀번호"></div><button class="p" data-a="login">입장하기</button>
    ${live?'':'<p class="mut">데모: 반 코드 3-2 / kim01 / 123456 (탭을 두 개 열어 lee02로 입장해 보세요) · 선생님은 반 코드 비우고 master / 123456</p>'}`}
    <p class="err">${esc(err)}</p><button data-a="${live?'reconn':'exitdemo'}">${live?'연결 바꾸기':'데모 끝내기'}</button></div>`;
}
function render(){
  if(!live&&!demo)return connectView();
  if(!ready)return;
  const u=U()[me],h=$('hd');
  h.innerHTML=me?`${role==='master'?'선생님':u?esc(u.name):''} ${role==='student'?'<button data-a="mypw">비밀번호</button> ':''}<button data-a="out">로그아웃</button>`:'';
  $('app').className='';
  if(!me)return loginView();
  if(role==='master'){if(gid&&GS()[gid])return gameView();return masterView()}
  if(role==='student'&&u){if(gid)return gameView();return home()}
  $('app').innerHTML='불러오는 중…';
}

// ---------- Events ----------
setInterval(()=>{
  const g=GS()[gid];if(!g||g.status!=='play'||!$('cw'))return;
  $('cw').textContent=clk(g,'w');$('cb').textContent=clk(g,'b');
  const t=new Chess(g.fen).turn();if(g.clock[t]-(B.now()-g.clock.t)<=0)claim(gid);
},500);
addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lp'){const b=document.querySelector('[data-a=login],[data-a=setup]');b&&b.click()}});
document.addEventListener('click',async e=>{
  const sq=e.target.closest('[data-sq]');
  if(sq&&gid&&GS()[gid]){const g=GS()[gid];if(g.status!=='play')return;const s=sq.dataset.sq,c=new Chess(g.fen),t=c.turn();
    if(!((t==='w'&&g.w===me)||(t==='b'&&g.b===me)))return;
    if(sel&&c.moves({square:sel,verbose:true}).some(m=>m.to===s)){move(sel,s);return}
    const p=c.get(s);sel=p&&p.color===t?s:null;gameView();return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;err='';msg='';
  try{
    if(a==='conn'){const m=v('cf').match(/\{[\s\S]*\}/);if(!m)throw new Error('{ ... } 형태의 코드를 붙여넣어 주세요.');
      const o=JSON.parse(m[0].replace(/\/\/.*$/gm,'').replace(/([{,]\s*)([A-Za-z0-9_$]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*([}\]])/g,'$1'));
      if(!o.apiKey||!o.databaseURL)throw new Error('apiKey 또는 databaseURL이 없어요. Realtime Database를 먼저 만드세요.');
      localStorage.setItem('chessCfg',JSON.stringify(o));localStorage.removeItem('chessDemoOn');location.reload();return}
    if(a==='reconn'){localStorage.removeItem('chessCfg');location.reload();return}
    if(a==='demo'){localStorage.setItem('chessDemoOn','1');location.reload();return}
    if(a==='exitdemo'){B.reset();localStorage.removeItem('chessDemoOn');location.reload();return}
    if(a==='setup'){const p=v('lp');if(p.length<6)throw new Error('6자 이상 입력하세요.');const u=await B.create('master',p,true);await B.set('config/master',u);await B.set('config/masterName',v('mn')||'선생님');MASTER=u;me=u;await ident();return}
    if(a==='login'){const c=v('lc').trim().toLowerCase();try{localStorage.setItem('chessCls',c)}catch(x){}await B.signIn(c?c+'.'+v('li').trim():'master',v('lp'));return}
    if(a==='out'){gid=null;await B.signOut()}
    else if(a==='mypw'){const p=prompt('새 비밀번호 (6자 이상)');if(p&&p.length>=6){await B.setPw(p);alert('변경했어요.')}}
    else if(a==='rank')search();
    else if(a==='qc'){searching=false;B.tx(pth()+'queue',q=>{if(q)delete q[me];return q&&Object.keys(q).length?q:null})}
    else if(a==='chal'){const o=v('op');if(o)gid=newG(me,o,!!v('rk'),'pick')}
    else if(a==='open'){gid=id;sel=null}
    else if(a==='close'){gid=null;sel=null}
    else if(a==='res'){if(confirm('정말 기권할까요?'))resign(gid)}
    else if(a==='tab'){tab=id;share=null}
    else if(a==='pick'){cid=id;try{localStorage.setItem('chessCls',id)}catch(x){}watch()}
    else if(a==='shr')share=id;else if(a==='shx')share=null;
    else if(a==='ncls'){const c=v('cc').trim().toLowerCase(),n=v('cn').trim();if(!/^[a-z0-9-]{2,20}$/.test(c)||!n)throw new Error('반 이름과 반 코드(영문·숫자·-)를 확인하세요.');
      if(CL[c])throw new Error('이미 있는 반 코드예요.');await B.set('classList/'+c,{name:n});await B.set('classes/'+c+'/meta',{name:n});cid=c;watch()}
    else if(a==='dcls'){if(confirm('반과 모든 기록을 삭제할까요?')){await B.rm('classList/'+id);await B.rm('classes/'+id);if(cid===id)cid=null}}
    else if(a==='asg'){const x=v('a1'),y=v('a2');if(x===y)throw new Error('서로 다른 학생을 고르세요.');newG(x,y,!!v('ar'),'assign');tab='live'}
    else if(a==='add')await addS(v('ai'),v('an'),'123456');
    else if(a==='bulk'){let n=0;for(const ln of v('bk').split('\n')){const[i,...r]=ln.split(',');if(i&&r.length){await addS(i,r.join(','),'123456');n++}}err=n+'명 등록했어요.'}
    else if(a==='esc'){const p=prompt('새 점수',U()[id].score);if(p!==null&&!isNaN(+p))await B.set(pth()+'users/'+id+'/score',+p)}
    else if(a==='del'){if(confirm('학생을 삭제할까요?')){await B.rm(pth()+'users/'+id);await B.rm('members/'+id)}}
    else if(a==='void'){const g=GS()[id];if(g&&confirm('이 경기를 무효 처리하고 점수를 되돌릴까요?')){apply(g,-1);await B.set(pth()+'games/'+id+'/status','void')}}
    else if(a==='sset'){const o={};for(const k of Object.keys(DS))o[k]=+v('s_'+k);await B.set(pth()+'settings',o);msg='저장했어요.'}
    else if(a==='sdef'){await B.rm(pth()+'settings')}
    else if(a==='season'){if(confirm('시즌을 종료하고 점수를 초기화할까요?')){const S=St(),us=Object.entries(U()),top=us.sort((x,y)=>y[1].score-x[1].score)[0],n=Object.keys(C.seasons||{}).length+1,up={};
      if(top)up[pth()+'seasons/'+n]={n,name:top[1].name,score:top[1].score};us.forEach(([k])=>{const p=pth()+'users/'+k+'/';up[p+'score']=S.start;up[p+'placed']=0});await B.upd('',up)}}
  }catch(x){err=x&&x.code&&x.code.startsWith('auth/')?(x.code==='auth/email-already-in-use'?'이미 있는 아이디예요.':'아이디 또는 비밀번호가 올바르지 않아요.'):(x&&x.message)||'오류가 났어요.'}
  render();
});
B.onAuth(u=>{if(!live&&!demo)return;me=u;ident()});
if(live||demo)B.init().then(async()=>{if(live||demo){if(live){try{MASTER=await B.get('config/master')}catch(e){}}ready=true;render()}}).catch(e=>{err=e.message;ready=true;render()});
if(!live&&!demo)render();
</script></body></html>
